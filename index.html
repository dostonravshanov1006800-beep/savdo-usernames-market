<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Savdo — Instagram Marketplace</title>
<meta name="description" content="Маркетплейс Instagram-аккаунтов и юзернеймов. Покупай, продавай, предлагай цену — безопасно.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F4F5F7">
<link rel="icon" href="https://media.base44.com/images/public/6ab0a3e2e959cd31a868bc34/0b5eee824_generated_image.png">
<link rel="apple-touch-icon" href="https://media.base44.com/images/public/6ab0a3e2e959cd31a868bc34/0b5eee824_generated_image.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#ECEEF2; --border:#E3E6EC;
  --text:#0F1115; --text-2:#6B7280; --accent:#3D7BF0; --success:#22C55E;
  --warn:#F59E0B; --danger:#EF4444;
  --ig1:#F58529; --ig2:#DD2A7B; --ig3:#8134AF; --ig4:#515BD4;
  --shadow-sm:0 1px 2px rgba(15,17,21,.04); --shadow-lg:0 8px 24px rgba(15,17,21,.06);
  --r-card:16px; --r-tile:14px; --r-chip:999px; --r-input:12px; --r-btn:14px;
}
html[data-theme="dark"]{
  --bg:#0B0C10; --surface:#14161C; --surface-2:#1C1F27; --border:#262A34;
  --text:#F2F4F8; --text-2:#9AA1B2; --accent:#5B93FF; --success:#34D399;
  --warn:#FBBF24; --danger:#F87171; --shadow-sm:none; --shadow-lg:none;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing:antialiased;}
.wordmark{font-family:'Pacifico',cursive; font-size:22px; color:var(--text); line-height:1;}
button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
img{max-width:100%; display:block;}
a{color:var(--accent); text-decoration:none;}
#app{max-width:430px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:84px;
  background:var(--bg); overflow-x:hidden;}
.hide{display:none !important;}
.icon{width:20px;height:20px;stroke-width:1.75;flex-shrink:0;}

/* Topbar */
.topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 16px 8px;}
.topbar .right{display:flex; align-items:center; gap:12px;}
.icon-btn{width:40px;height:40px; display:flex; align-items:center; justify-content:center;
  border-radius:999px; background:var(--surface-2); position:relative;}
.icon-btn .icon{color:var(--text);}
.badge-dot{position:absolute; top:-2px; right:-2px; min-width:16px; height:16px; border-radius:999px;
  background:var(--danger); border:2px solid var(--bg); color:#fff; font-size:9px; font-weight:700;
  display:flex; align-items:center; justify-content:center; padding:0 3px;}

/* search */
.search-wrap{padding:4px 16px 8px; display:flex; gap:8px; position:relative;}
.search-box{flex:1; background:var(--surface-2); border-radius:var(--r-input); display:flex;
  align-items:center; gap:8px; padding:0 12px; height:44px;}
.search-box input{border:none; background:none; color:var(--text); font-size:14px; width:100%; outline:none;}
.search-box .icon{color:var(--text-2);}
.clear-btn{width:22px;height:22px;border-radius:50%; background:var(--border); display:flex; align-items:center; justify-content:center;}
.clear-btn .icon{width:13px;height:13px;color:var(--text-2);}
.sq-btn{width:44px;height:44px; border-radius:var(--r-input); background:var(--surface-2);
  display:flex; align-items:center; justify-content:center;}
.sq-btn .icon{color:var(--text-2);}
.sq-btn.active{background:var(--text);}
.sq-btn.active .icon{color:var(--bg);}
/* suggestions dropdown */
.suggest{position:absolute; top:52px; left:16px; right:16px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-card); box-shadow:var(--shadow-lg); z-index:30; overflow:hidden;}
.suggest-item{display:flex; align-items:center; gap:10px; padding:10px 14px; font-size:13px; cursor:pointer;}
.suggest-item:active{background:var(--surface-2);}
.suggest-item .icon{width:15px;height:15px;color:var(--text-2);}
.recent-row{display:flex; gap:8px; overflow-x:auto; padding:0 16px 6px;}
.recent-row::-webkit-scrollbar{display:none;}
.recent-chip{flex:0 0 auto; display:flex; align-items:center; gap:5px; padding:6px 12px; border-radius:var(--r-chip);
  background:var(--surface-2); font-size:12px; font-weight:600; color:var(--text-2);}
.recent-chip .icon{width:12px;height:12px;}

/* section header */
.section{padding:12px 16px 0;}
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.section-head h3{font-size:16px; font-weight:600; margin:0;}
.see-all{font-size:13px; font-weight:600; color:var(--accent);}
.count-note{font-size:12px; color:var(--text-2); font-weight:500;}

/* categories */
.cat-row{display:flex; gap:10px; overflow-x:auto; padding:2px 16px 4px; scroll-snap-type:x proximity;}
.cat-row::-webkit-scrollbar{display:none;}
.cat-tile{flex:0 0 auto; scroll-snap-align:start; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-tile); padding:10px 16px; font-size:13px; font-weight:600; white-space:nowrap;
  box-shadow:var(--shadow-sm); transition:transform .2s;}
.cat-tile:active{transform:scale(.96);}
.cat-tile.active{background:var(--text); color:var(--bg);}

/* banner carousel */
.banner-wrap{padding:14px 16px 4px; position:relative;}
.banner-track{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; border-radius:18px;}
.banner-track::-webkit-scrollbar{display:none;}
.banner-slide{flex:0 0 100%; scroll-snap-align:start; border-radius:18px; overflow:hidden; position:relative; aspect-ratio:16/8.2;}
.banner-slide img{width:100%; height:100%; object-fit:cover;}
.banner-cap{position:absolute; left:16px; bottom:14px; color:#1a1a1a; font-weight:700; font-size:15px;
  background:rgba(255,255,255,.72); padding:6px 12px; border-radius:999px; backdrop-filter:blur(6px);}
.dots{display:flex; justify-content:center; gap:6px; margin-top:10px;}
.dot{width:6px;height:6px;border-radius:50%; background:var(--border); transition:all .25s;}
.dot.active{width:16px; background:var(--text);}

/* featured carousel */
.feat-track{display:flex; gap:12px; overflow-x:auto; padding:2px 16px 6px; scroll-snap-type:x mandatory;}
.feat-track::-webkit-scrollbar{display:none;}
.feat-card{flex:0 0 78%; scroll-snap-align:start; background:var(--surface); border:1px solid var(--border);
  border-radius:18px; box-shadow:var(--shadow-sm); overflow:hidden; cursor:pointer; transition:transform .15s;}
.feat-card:active{transform:scale(.98);}
.feat-hero{aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; position:relative;}
.feat-hero .uname{font-weight:700; font-size:24px; letter-spacing:-0.02em; color:#20212b;}
.fav-btn{position:absolute; top:10px; right:10px; width:32px;height:32px; border-radius:50%;
  background:rgba(255,255,255,.85); display:flex; align-items:center; justify-content:center; z-index:2;}
.fav-btn .icon{color:#20212b; width:17px;height:17px;}
.fav-btn.active .icon{color:var(--danger); fill:var(--danger);}
.feat-body{padding:12px 14px 14px;}
.feat-body .nm{font-size:15px; font-weight:700; display:flex; align-items:center; gap:5px;}
.feat-body .meta{font-size:12px; color:var(--text-2); margin-top:4px; display:flex; gap:10px; flex-wrap:wrap;}
.feat-body .price-row{display:flex; justify-content:space-between; align-items:center; margin-top:10px;}
.feat-body .price{font-size:16px; font-weight:700;}

/* pills / badges */
.pill{font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px; display:inline-flex; align-items:center; gap:3px; color:#fff;}
.pill.hot{background:linear-gradient(135deg,#F58529,#DD2A7B);}
.pill.verified{background:var(--success);}
.pill.type{background:var(--surface-2); color:var(--text-2);}
.status-chip{font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px;}
.status-available{background:color-mix(in srgb, var(--success) 15%, transparent); color:var(--success);}
.status-reserved{background:color-mix(in srgb, var(--warn) 18%, transparent); color:var(--warn);}
.status-sold{background:var(--surface-2); color:var(--text-2);}
.status-pending{background:color-mix(in srgb, var(--accent) 15%, transparent); color:var(--accent);}
.status-draft{background:var(--surface-2); color:var(--text-2);}
.status-archived{background:var(--surface-2); color:var(--text-2);}

/* listings grid */
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
  box-shadow:var(--shadow-sm); overflow:hidden; cursor:pointer; transition:transform .15s; position:relative;}
.card:active{transform:scale(.98);}
.card-preview{aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; position:relative; padding:14px;}
.card-preview .at{font-weight:700; letter-spacing:-0.02em; font-size:20px; color:#20212b; text-align:center;
  word-break:break-word; line-height:1.1; max-width:100%;}
.card-badges{position:absolute; top:10px; left:10px; display:flex; gap:4px; z-index:2;}
.sold-overlay{position:absolute; inset:0; background:rgba(255,255,255,.62); display:flex; align-items:center; justify-content:center; z-index:3;}
.sold-overlay span{background:#1a1a1a; color:#fff; font-size:12px; font-weight:700; padding:6px 14px; border-radius:999px;}
.card-body{padding:10px 12px 12px;}
.card-body .name{font-size:13px; font-weight:700; margin:0 0 2px; display:flex; align-items:center; gap:4px;}
.card-body .price{font-size:13px; font-weight:700;}
.card-body .sub{font-size:11px; color:var(--text-2); margin-top:2px;}
.card-foot{display:flex; align-items:center; justify-content:space-between; margin-top:6px;}

/* list mode rows */
.list-row{display:flex; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
  padding:12px; box-shadow:var(--shadow-sm); cursor:pointer; transition:transform .15s; position:relative;}
.list-row:active{transform:scale(.98);}
.list-thumb{width:74px; height:74px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:15px; color:#20212b; position:relative; flex-shrink:0; word-break:break-all; text-align:center; padding:6px;}
.list-info{flex:1; min-width:0;}
.list-info .nm{font-size:14px; font-weight:700; display:flex; align-items:center; gap:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.list-info .meta{font-size:11px; color:var(--text-2); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap;}
.list-info .pr{font-size:14px; font-weight:700; margin-top:6px;}
.list-side{display:flex; flex-direction:column; align-items:flex-end; justify-content:space-between;}
.view-toggle{display:flex; background:var(--surface-2); border-radius:999px; padding:3px;}
.view-toggle button{width:34px;height:30px; border-radius:999px; display:flex; align-items:center; justify-content:center;}
.view-toggle button.active{background:var(--surface); box-shadow:var(--shadow-sm);}
.view-toggle .icon{width:16px;height:16px; color:var(--text-2);}
.view-toggle button.active .icon{color:var(--text);}

/* chips row */
.chips-row{display:flex; gap:8px; overflow-x:auto; padding:0 16px 10px; align-items:center;}
.chips-row::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto; padding:7px 14px; border-radius:var(--r-chip); font-size:13px; font-weight:600;
  background:var(--surface-2); color:var(--text-2); white-space:nowrap;}
.chip.active{background:var(--accent); color:#fff;}
.chip.danger{color:var(--danger);}

/* bottom nav */
.bottom-nav{position:fixed; bottom:0; left:0; right:0; max-width:430px; margin:0 auto; height:64px;
  padding-bottom:env(safe-area-inset-bottom); background:color-mix(in srgb, var(--surface) 85%, transparent);
  backdrop-filter:blur(16px); border-top:1px solid var(--border); display:flex; z-index:50;}
.nav-item{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; position:relative;}
.nav-item .icon{color:var(--text-2);}
.nav-item .pill-bg{position:absolute; top:2px; width:40px;height:26px; border-radius:999px; background:var(--surface-2); z-index:-1;
  opacity:0; transition:opacity .2s;}
.nav-item.active .icon{color:var(--text);}
.nav-item.active .pill-bg{opacity:1;}
.nav-item.active::before{content:''; position:absolute; top:-1px; left:30%; right:30%; height:2px; background:var(--text); border-radius:2px;}
.nav-item .lbl{font-size:10px; font-weight:600; color:var(--text-2);}
.nav-item.active .lbl{color:var(--text);}

/* views */
.view{animation:fadeIn .25s ease-out;}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* profile */
.profile-top{display:flex; align-items:center; gap:14px; padding:16px;}
.avatar-wrap{position:relative;}
.avatar{width:72px;height:72px; border-radius:50%; background:linear-gradient(135deg,var(--ig1),var(--ig2),var(--ig3),var(--ig4));
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:26px;}
.profile-top .meta{flex:1; min-width:0;}
.profile-top .nm{font-weight:700; font-size:16px; display:flex; align-items:center; gap:5px;}
.profile-top .sub{font-size:12px; color:var(--text-2); margin-top:2px;}
.profile-btns{display:flex; gap:8px; padding:0 16px 14px;}
.profile-btns .btn{height:38px; font-size:13px;}
.stat-cards{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:0 16px;}
.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-tile); padding:12px 8px; text-align:center;}
.stat-card b{font-size:17px; display:block;}
.stat-card span{font-size:10px; color:var(--text-2);}
.ptabs{display:flex; margin-top:14px; border-top:1px solid var(--border); border-bottom:1px solid var(--border);}
.ptab{flex:1; display:flex; justify-content:center; align-items:center; gap:6px; padding:11px 0; position:relative; font-size:12px; font-weight:600; color:var(--text-2);}
.ptab .icon{width:16px;height:16px;}
.ptab.active{color:var(--text);}
.ptab.active::after{content:''; position:absolute; bottom:-1px; left:20%; right:20%; height:2px; background:var(--text);}
.settings-list{padding:8px 16px;}
.srow{display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--border); font-size:14px;}
.srow .left{display:flex; align-items:center; gap:10px;}
.srow .icon{color:var(--text-2);}
.srow .end{font-size:12px; color:var(--text-2); display:flex; align-items:center; gap:6px;}
.switch{width:44px;height:26px; border-radius:999px; background:var(--surface-2); position:relative; transition:.2s;}
.switch.on{background:var(--success);}
.switch i{position:absolute; top:3px; left:3px; width:20px;height:20px; border-radius:50%; background:#fff; transition:.2s; box-shadow:var(--shadow-sm);}
.switch.on i{left:21px;}
.lang-pick{display:flex; gap:6px;}
.lang-pick button{padding:5px 10px; border-radius:999px; background:var(--surface-2); font-size:12px; font-weight:700;}
.lang-pick button.active{background:var(--accent); color:#fff;}
.admin-entry{margin:16px; padding:14px; border-radius:var(--r-card); background:linear-gradient(135deg,#1a1a1a,#333); color:#fff;
  display:flex; align-items:center; justify-content:space-between;}
.sect-label{padding:16px 16px 6px; font-size:11px; font-weight:700; color:var(--text-2); text-transform:uppercase; letter-spacing:.04em;}

/* offers / notifications */
.offer-row{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border);}
.offer-row .th{width:46px;height:46px;border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#20212b; flex-shrink:0; text-align:center; word-break:break-all; padding:4px;}
.offer-row .info{flex:1; min-width:0;}
.offer-row .info .l1{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.offer-row .info .l2{font-size:11px; color:var(--text-2); margin-top:2px;}
.notif-row{display:flex; gap:12px; padding:13px 16px; border-bottom:1px solid var(--border); align-items:flex-start;}
.notif-row.unread{background:color-mix(in srgb, var(--accent) 6%, transparent);}
.notif-ic{width:36px;height:36px;border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.notif-ic .icon{width:16px;height:16px; color:var(--text-2);}
.notif-body{flex:1;}
.notif-body .t{font-size:13px; font-weight:600;}
.notif-body .d{font-size:12px; color:var(--text-2); margin-top:1px;}
.notif-body .tm{font-size:10px; color:var(--text-2); margin-top:3px;}
.mini-actions{display:flex; gap:6px; margin-top:6px;}
.mini-actions .chip{padding:5px 12px; font-size:12px;}
.mini-actions .chip.accept{background:var(--success); color:#fff;}
.mini-actions .chip.reject{background:var(--surface-2); color:var(--danger);}

/* buttons */
.btn{height:48px; border-radius:var(--r-btn); font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; gap:6px; width:100%;}
.btn-sm{height:34px; font-size:12px; padding:0 14px; width:auto; border-radius:999px;}
.btn-primary{background:var(--text); color:var(--bg);}
.btn-outline{background:var(--surface); border:1px solid var(--border); color:var(--text);}
.btn-ghost{background:var(--surface-2); color:var(--text);}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.45; pointer-events:none;}

/* detail */
.detail-hero{aspect-ratio:1/0.82; display:flex; align-items:center; justify-content:center; position:relative; margin:0 16px; border-radius:20px; flex-direction:column; gap:10px;}
.detail-hero .at{font-weight:700; font-size:34px; letter-spacing:-0.02em; color:#20212b; text-align:center; padding:0 20px; word-break:break-all;}
.detail-hero .av-ring{width:64px;height:64px;border-radius:50%; background:linear-gradient(135deg,var(--ig1),var(--ig2),var(--ig3),var(--ig4)); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; color:#fff;}
.back-fab{position:absolute; top:16px; left:16px; width:40px;height:40px; border-radius:50%; background:rgba(255,255,255,.85);
  display:flex; align-items:center; justify-content:center; z-index:5;}
.price-row{display:flex; align-items:baseline; justify-content:space-between; padding:0 16px;}
.price-row .amt{font-size:26px; font-weight:700;}
.price-row .label{font-size:12px; color:var(--text-2);}
.seller-row{display:flex; align-items:center; gap:10px; padding:14px 16px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); margin:14px 0;}
.seller-row .av{width:44px;height:44px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-weight:700;}
.seller-row .meta{flex:1; min-width:0;}
.seller-row .meta .nm{font-size:14px; font-weight:600; display:flex; align-items:center; gap:4px;}
.seller-row .meta .st{font-size:12px; color:var(--text-2);}
.verified-chip{display:inline-flex; align-items:center; gap:3px; background:color-mix(in srgb, var(--success) 15%, transparent); color:var(--success); font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px;}
.verified-chip .icon{width:10px;height:10px;}
.stats-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 16px;}
.stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-tile); padding:12px 8px; text-align:center;}
.stat-tile b{font-size:15px; display:block;}
.stat-tile span{font-size:10px; color:var(--text-2);}
.safety-block{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px;}
.safe-item{display:flex; gap:8px; align-items:flex-start; font-size:12px; color:var(--text-2);}
.safe-item .icon{width:16px;height:16px; color:var(--success); margin-top:1px;}
.tag-row{display:flex; gap:6px; flex-wrap:wrap; padding:0 16px;}
.tag{font-size:11px; font-weight:600; background:var(--surface-2); color:var(--text-2); padding:4px 10px; border-radius:999px;}
.desc-block{padding:0 16px; font-size:13px; line-height:1.55; color:var(--text);}
.dates-row{padding:0 16px; font-size:11px; color:var(--text-2); display:flex; gap:14px;}
.action-bar{position:fixed; bottom:64px; left:0; right:0; max-width:430px; margin:0 auto; background:var(--surface);
  border-top:1px solid var(--border); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; z-index:40;}

/* sheet */
.sheet-overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .2s;}
.sheet-overlay.show{opacity:1; pointer-events:auto;}
.sheet{width:100%; max-width:430px; margin:0 auto; background:var(--surface); border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(100%); transition:transform .25s ease-out; max-height:85vh; overflow-y:auto;}
.sheet-overlay.show .sheet{transform:translateY(0);}
.sheet h3{margin:0 0 14px;}
.sheet .field{margin-bottom:12px;}
.sheet label{font-size:12px; color:var(--text-2); display:block; margin-bottom:5px;}
.sheet input, .sheet select, .sheet textarea{width:100%; height:46px; border-radius:var(--r-input); border:1px solid var(--border); background:var(--surface-2); padding:0 12px; font-size:14px; color:var(--text); font-family:inherit;}
.sheet textarea{height:80px; padding:10px 12px;}
.sheet-actions{display:flex; gap:10px; margin-top:16px;}
.err{color:var(--danger); font-size:11px; margin-top:4px; display:none;}
.err.show{display:block;}
.radio-row{display:flex; flex-direction:column; gap:8px;}
.radio-opt{display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--border); border-radius:12px; font-size:14px; cursor:pointer;}
.radio-opt.sel{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent);}
.sort-opt{display:flex; align-items:center; justify-content:space-between; padding:13px 4px; border-bottom:1px solid var(--border); font-size:14px; cursor:pointer;}
.toast{position:fixed; bottom:140px; left:50%; transform:translateX(-50%); background:#1a1a1a; color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600; z-index:200; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; max-width:85vw; text-align:center;}
.toast.show{opacity:1;}

/* sell wizard */
.hero-sell{padding:20px 16px 8px; text-align:center;}
.hero-sell h2{font-size:22px; margin:0 0 6px;}
.hero-sell p{font-size:13px; color:var(--text-2); margin:0 0 16px;}
.benefits{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px 16px;}
.benefit{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-tile); padding:12px; display:flex; gap:8px; align-items:flex-start; text-align:left;}
.benefit .icon{color:var(--accent); width:18px;height:18px; margin-top:1px;}
.benefit b{font-size:12px; display:block;}
.benefit span{font-size:11px; color:var(--text-2);}
.warn-banner{margin:0 16px 12px; padding:10px 12px; border-radius:12px; background:color-mix(in srgb, var(--warn) 12%, transparent);
  display:flex; gap:8px; align-items:flex-start; font-size:12px; color:var(--text);}
.warn-banner .icon{color:var(--warn); width:16px;height:16px; margin-top:1px;}
.wiz{padding:0 16px 16px;}
.wiz-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.wiz-head .step-no{font-size:12px; color:var(--text-2); font-weight:600;}
.progress{height:4px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin-bottom:16px;}
.progress i{display:block; height:100%; background:var(--text); border-radius:999px; transition:width .25s;}
.type-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.type-card{border:1px solid var(--border); border-radius:var(--r-tile); padding:14px; display:flex; flex-direction:column; gap:8px; cursor:pointer; background:var(--surface);}
.type-card .icon{color:var(--text-2);}
.type-card b{font-size:13px;}
.type-card span{font-size:11px; color:var(--text-2);}
.type-card.sel{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent);}
.type-card.sel .icon{color:var(--accent);}
.wiz-nav{display:flex; gap:10px; margin-top:18px;}
.fee-line{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; color:var(--text-2);}
.fee-line b{color:var(--text);}
.success-view{text-align:center; padding:48px 24px;}
.success-ic{width:76px;height:76px; border-radius:50%; background:var(--success); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 16px;}
.success-ic .icon{width:36px;height:36px;}
.my-tabs{display:flex; gap:8px; overflow-x:auto; padding:0 16px 10px;}
.my-tabs::-webkit-scrollbar{display:none;}
.mgmt-row{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border);}
.mgmt-row .th{width:52px;height:52px;border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#20212b; flex-shrink:0; word-break:break-all; text-align:center; padding:4px; position:relative;}
.mgmt-row .info{flex:1; min-width:0;}
.mgmt-row .info .l1{font-size:13px; font-weight:700; display:flex; gap:6px; align-items:center;}
.mgmt-row .info .l2{font-size:11px; color:var(--text-2); margin-top:2px;}
.mgmt-actions{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
.mgmt-actions .chip{padding:4px 10px; font-size:11px;}

/* skeleton */
.skel{background:linear-gradient(90deg,var(--surface-2) 25%, var(--border) 37%, var(--surface-2) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:var(--r-card);}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.skel-banner{height:150px; border-radius:18px; margin:14px 16px 4px;}
.skel-row{height:64px; margin:0 16px 10px;}
.skel-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px;}
.skel-card{height:210px;}
.empty-state{text-align:center; padding:50px 24px; color:var(--text-2);}
.empty-state .icon{width:44px;height:44px; margin:0 auto 10px; color:var(--border);}
.disclaimer{padding:20px 16px 10px; font-size:11px; color:var(--text-2); text-align:center; line-height:1.5;}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}}
</style>

/* ---------------- QUERY ENGINE ---------------- */
function applyFilters(list){
  const f = STATE.market;
  let out = list.slice();
  if(f.q){ const q=f.q.toLowerCase(); out=out.filter(l=> l.username.toLowerCase().includes(q)
    || (l.displayName||'').toLowerCase().includes(q) || catName(l.category).toLowerCase().includes(q)
    || (l.niche||'').toLowerCase().includes(q)); }
  if(f.cat && f.cat!=='all') out=out.filter(l=>l.category===f.cat);
  if(f.priceMin!=='' && f.priceMin!=null) out=out.filter(l=>l.price>=Number(f.priceMin));
  if(f.priceMax!=='' && f.priceMax!=null) out=out.filter(l=>l.price<=Number(f.priceMax));
  if(f.folMin!=='' && f.folMin!=null) out=out.filter(l=>l.followers>=Number(f.folMin));
  if(f.engMin!=='' && f.engMin!=null) out=out.filter(l=>Number(l.engagement)>=Number(f.engMin));
  if(f.country!=='all') out=out.filter(l=>l.country===f.country);
  if(f.language!=='all') out=out.filter(l=>l.language===f.language);
  if(f.verified) out=out.filter(l=>sellerById(l.sellerId).verified);
  if(f.availability==='available') out=out.filter(l=>l.status==='active');
  else if(f.availability!=='all') out=out.filter(l=>l.status===f.availability);
  return out;
}
function sortList(list, mode){
  const s = mode || 'recommended';
  const arr = list.slice();
  if(s==='newest') arr.sort((a,b)=>b.createdAt-a.createdAt);
  else if(s==='priceLow') arr.sort((a,b)=>a.price-b.price);
  else if(s==='priceHigh') arr.sort((a,b)=>b.price-a.price);
  else if(s==='followers') arr.sort((a,b)=>b.followers-a.followers);
  else if(s==='engagement') arr.sort((a,b)=>Number(b.engagement)-Number(a.engagement));
  else if(s==='rating') arr.sort((a,b)=>sellerById(b.sellerId).rating-sellerById(a.sellerId).rating);
  else arr.sort((a,b)=> (b.featured-a.featured) || (b.createdAt-a.createdAt));
  return arr;
}
function marketResults(){ return sortList(applyFilters(api.getListings().filter(l=>l.status!=='draft'&&l.status!=='archived')), STATE.market.sort); }

function submitOffer(id){
  const l = api.getListing(id);
  const amt = Number(document.getElementById('off_amt').value);
  const msg = document.getElementById('off_msg').value;
  const exp = Number(document.getElementById('off_exp').value);
  if(!amt || amt<=0){ toast(t('invalidNumber')); return; }
  api.addOffer({ listingId:id, fromUserId:CURRENT_UID, toUserId:l.sellerId, amount:amt, message:msg, expiresAt:Date.now()+exp });
  if(l.sellerId===CURRENT_UID){} // self offer unlikely
  api.notify({ type:'offer', title:t('notifNewOffer'), text:`${CURRENT_UNAME} → ${fmtPrice(amt,l.currency)} for ${l.username}` });
  closeSheet(); toast(t('offerSent')); haptic('medium');
}

  } else {
    const preview = { id:'preview', type:d.type, username:d.username.startsWith('@')?d.username:'@'+d.username,
      displayName:d.displayName, price:Number(d.price)||0, currency:d.currency, category:d.category||d.type,
      followers:Number(d.followers)||0, following:Number(d.following)||0, posts:Number(d.posts)||0,
      engagement:d.engagement||0, status:'active', sellerId:CURRENT_UID, featured:false,
      description:d.description, tags:['clean'] };
    body = `<div style="max-width:280px;margin:0 auto">${gridCardHTML(preview)}</div>`;
  }
  return `<div class="view">
    ${topbarHTML()}
    <div class="wiz">
      <div class="wiz-head"><button class="icon-btn" style="width:32px;height:32px" onclick="wizBack()"><i data-lucide="chevron-left" class="icon" style="width:16px;height:16px"></i></button>
        <span class="step-no">${t('step')} ${step} ${t('of')} 5 — ${steps[step-1]}</span></div>
      <div class="progress"><i style="width:${step*20}%"></i></div>
      ${body}
      <div class="wiz-nav">
        ${step>1?`<button class="btn btn-ghost" onclick="wizPrev()">${t('back')}</button>`:''}
        <button class="btn btn-primary" onclick="wizNext()">${step===5?t('publish'):t('next')}</button>
      </div>
    </div>
    <div class="warn-banner"><i data-lucide="shield-alert" class="icon"></i><span>${t('neverShare')}</span></div>
    ${disclaimerHTML()}
  </div>`;
}
function wizBack(){ STATE.sell.screen='hero'; STATE.sell.publishedId=null; render(); }
function wizPrev(){ if(STATE.sell.step>1){ collectWizard(); STATE.sell.step--; render(); } }
function feeRecalc(){
  const d=STATE.sell.draft;
  const p=Number(document.getElementById('w_price').value)||0;
  const cur=document.getElementById('w_cur').value;
  const fee=Math.round(p*FEE_PCT);
  document.getElementById('fee_fee').textContent='−'+fmtPrice(fee,cur);
  document.getElementById('fee_get').textContent=fmtPrice(p-fee,cur);
  document.getElementById('fee_total').textContent=fmtPrice(p,cur);
}
function collectWizard(){
  const d=STATE.sell.draft, step=STATE.sell.step;
  if(step===2){
    d.username=document.getElementById('w_user').value.trim();
    d.displayName=document.getElementById('w_disp').value.trim();
    d.category=document.getElementById('w_cat').value;
    d.description=document.getElementById('w_desc').value.trim();
    d.country=document.getElementById('w_country').value;
    d.language=document.getElementById('w_lang').value;
  } else if(step===3 && d.type!=='username'){
    d.followers=document.getElementById('w_fol').value; d.following=document.getElementById('w_folw').value;
    d.posts=document.getElementById('w_posts').value; d.engagement=document.getElementById('w_eng').value;
    d.accountAge=document.getElementById('w_age').value; d.niche=document.getElementById('w_niche').value;
  } else if(step===4){
    d.price=document.getElementById('w_price').value; d.currency=document.getElementById('w_cur').value;
    d.minOffer=document.getElementById('w_minoff').value;
  }
  saveDraft();
}
function showErr(id){ const e=document.getElementById(id); if(e) e.classList.add('show'); return false; }
function wizNext(){
  const d=STATE.sell.draft, step=STATE.sell.step;
  collectWizard();
  if(step===1 && !d.type){ toast(t('type')); return; }
  if(step===2){
    document.querySelectorAll('.err').forEach(e=>e.classList.remove('show'));
    let ok=true;
    if(!/^@?[a-z0-9._]{3,30}$/i.test(d.username)) ok=showErr('e_user');
    if(!d.displayName) ok=showErr('e_disp')&&ok;
    if(!d.description) ok=showErr('e_desc')&&ok;
    if(!ok) return;
  }
  if(step===3 && d.type!=='username'){
    document.querySelectorAll('.err').forEach(e=>e.classList.remove('show'));
    let ok=true;
    ['followers'].forEach(()=>{});
    if(Number(d.followers)<0||d.followers==='') ok=showErr('e_fol')&&ok;
    if(Number(d.engagement)<0||Number(d.engagement)>100||d.engagement==='') ok=showErr('e_eng')&&ok;
    if(!ok) return;
  }
  if(step===4){
    document.querySelectorAll('.err').forEach(e=>e.classList.remove('show'));
    if(!d.price || Number(d.price)<=0){ showErr('e_price'); return; }
  }
  if(step===5){ publishDraft(); return; }
  STATE.sell.step++; saveDraft(); render();
}
function publishDraft(){
  const d=STATE.sell.draft;
  const l = api.createListing({ type:d.type, username:d.username.startsWith('@')?d.username:'@'+d.username,
    displayName:d.displayName, price:Number(d.price), currency:d.currency, category:d.category||d.type,
    description:d.description, followers:Number(d.followers)||0, following:Number(d.following)||0,
    posts:Number(d.posts)||0, engagement:d.engagement||0, accountAge:Number(d.accountAge)||0,
    niche:d.niche||'', country:d.country, language:d.language, tags:['clean'], minOffer:d.minOffer?Number(d.minOffer):null });
  api.notify({type:'approved', title:t('yourListingLive'), text:l.username+' · '+fmtPrice(l.price,l.currency)});
  localStorage.removeItem('savdo_draft');
  STATE.sell.draft=null; STATE.sell.publishedId=l.id; render();
}

function adminCycleStatus(id){
  const l=api.getListing(id); if(!l) return;
  const chain=['active','reserved','sold','pendingReview','draft','archived'];
  const next=chain[(chain.indexOf(l.status)+1)%chain.length];
  api.updateListing(id,{status:next}); render();
}

function openSheet(html){ document.getElementById('sheetContent').innerHTML=html; document.getElementById('sheetOverlay').classList.add('show'); requestAnimationFrame(()=>{try{lucide.createIcons();}catch(e){}}); }
function closeSheet(){ document.getElementById('sheetOverlay').classList.remove('show'); }
document.getElementById('sheetOverlay').addEventListener('click', e=>{ if(e.target.id==='sheetOverlay') closeSheet(); });
let toastTimer;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1800); }

/* banner autoplay */
let bannerIdx=0, bannerInterval;
function initBanner(){
  const track=document.getElementById('bannerTrack'); if(!track) return;
  clearInterval(bannerInterval);
  bannerInterval=setInterval(()=>{
    bannerIdx=(bannerIdx+1)%BANNERS.length;
    track.scrollTo({left:track.clientWidth*bannerIdx, behavior:'smooth'});
    document.querySelectorAll('#bannerDots .dot').forEach((d,i)=>d.classList.toggle('active', i===bannerIdx));
  },5000);
}
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }

render();
