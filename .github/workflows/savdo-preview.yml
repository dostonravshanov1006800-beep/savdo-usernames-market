name: savdo-preview
on:
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/notify.mjs
        env:
          SAVDO_BOT_TOKEN: ${{ secrets.SAVDO_BOT_TOKEN }}
          PREVIEW_WELCOME: '8396883978'
