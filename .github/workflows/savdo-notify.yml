name: savdo-notify
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'   # backup only — GitHub schedules proved unreliable for this repo; the chain below is primary

# Self-perpetuating chain: each run does the reminder sweep, sleeps out a ~9.5
# min cycle, then dispatches the next run. This keeps the sweep alive 24/7 even
# though scheduled runs never fire on their own for this repository.
concurrency:
  group: savdo-notify
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - name: Reminder sweep
        env:
          SAVDO_BOT_TOKEN: ${{ secrets.SAVDO_BOT_TOKEN }}
        run: node scripts/notify.mjs

      - name: Hold cycle (~9 min) then pass the baton
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 540
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/savdo-notify.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$HTTP" = "204" ]; then
            echo "chain: next run dispatched (204)"
          else
            echo "chain: dispatch FAILED (HTTP $HTTP)"
          fi
